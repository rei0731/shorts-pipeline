name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # テストは外部サービスも重い依存も使わない純関数だけを対象にしている
      - run: pip install pytest janome python-dotenv
      - run: python -m pytest -q
